name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check Lua OSD syntax & Flatpak manifest JSON
        run: |
          luac -p app/mpv/playdeck.lua
          python3 -m json.tool packaging/io.github.wheheohu.PlayDeck.json > /dev/null

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Unit tests
        working-directory: app
        run: npm test

      - name: Build renderer & Electron main/preload
        working-directory: app
        run: npm run build
