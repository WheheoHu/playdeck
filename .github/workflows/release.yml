name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Flatpak & Publish Release
    runs-on: ubuntu-latest
    env:
      PLAYDECK_CHANNEL: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Compute build version
        id: version
        run: |
          VERSION=$(./app/scripts/version.sh)
          echo "Build version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle=PlayDeck_${VERSION}_x86_64.flatpak" >> "$GITHUB_OUTPUT"

      - name: Build PlayDeck app
        working-directory: app
        env:
          PLAYDECK_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak \
            flatpak-builder \
            ostree \
            elfutils \
            ccache

      - name: Cache Flatpak downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder/ccache
            .flatpak-builder/downloads
            .flatpak-builder/git
          key: flatpak-${{ runner.os }}-${{ hashFiles('packaging/io.github.wheheohu.PlayDeck.json') }}
          restore-keys: |
            flatpak-${{ runner.os }}-

      - name: Build Flatpak bundle
        env:
          SKIP_APP_BUILD: '1'
          PLAYDECK_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: ./packaging/build-flatpak.sh "${{ steps.version.outputs.bundle }}"

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayDeck_${{ steps.version.outputs.version }}
          path: |
            ${{ steps.version.outputs.bundle }}
            SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PlayDeck ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.version.outputs.bundle }}
            SHA256SUMS
